[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Local MCP server exposing Garmin Connect health and activity data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.19",
    "mcp>=2.3.0,<3",
]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
